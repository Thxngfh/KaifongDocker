version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: kaifong_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kaifong
      POSTGRES_PASSWORD: kaifong1234
      POSTGRES_DB: kaifongdb
    ports:
      - "5433:5432"
    volumes:
      - kaifong_db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaifong -d kaifongdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  kaifongliff:
    build: ./kaifongliff
    container_name: kaifongliff
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kaifong
      DB_PASSWORD: kaifong1234
      DB_NAME: kaifongdb
    volumes:
      - ./kaifongliff/uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy

  kaifongai:
    build: ./kaifongai
    container_name: kaifongai
    ports:
      - "3001:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kaifong
      DB_PASSWORD: kaifong1234
      DB_NAME: kaifongdb
    depends_on:
      postgres:
        condition: service_healthy

  kaifong_ai_v2:
    build: ./kaifong_ai_v2
    container_name: kaifong_ai_v2
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://kaifong:kaifong1234@postgres:5432/kaifongdb
      LINE_CHANNEL_ACCESS_TOKEN: 2009976440-qF0Wpy5x
    depends_on:
      postgres:
        condition: service_healthy

  ml-scheduler:
    build: ./ml-scheduler
    container_name: kaifong_ml_scheduler
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://kaifong:kaifong1234@postgres:5432/kaifongdb
      CLUSTER_MAX_K: "6"
      CLUSTER_PCA_COMPONENTS: "2"
      RISK_ACCEPT_ROC_AUC: "0.75"
      RISK_MAX_RETRAIN_ROUNDS: "3"
      RISK_TOP_N_FACTORS: "5"
      RISK_MODEL_DIR: /app/models
      DASHBOARD_REFRESH_API: ""     # ใส่ webhook ถ้ามี ไม่มีก็เว้นว่างไว้ได้
    volumes:
      - ml_models:/app/models        # เก็บโมเดลที่ train เสร็จไว้ ไม่หายตอน rebuild
      - ml_logs:/app/logs            # เก็บ log ไว้ ไม่หายตอน restart
    depends_on:
      postgres:
        condition: service_healthy 

  risk-listener:
    build: ./ml-scheduler
    container_name: kaifong_risk_listener
    restart: unless-stopped
    entrypoint: ["python3", "/app/scripts/listener.py"]   # <-- override entrypoint เดิม (ไม่ใช้ cron)
    environment:
      DATABASE_URL: postgresql://kaifong:kaifong1234@postgres:5432/kaifongdb
      RISK_MODEL_DIR: /app/models
      RISK_TOP_N_FACTORS: "5"
    volumes:
      - ml_models:/app/models     # ต้องเป็น volume เดียวกับ ml-scheduler ห้ามสร้างใหม่
    depends_on:
      postgres:
        condition: service_healthy
      ml-scheduler:
        condition: service_started

  db-scheduler:
    build: ./db-scheduler
    container_name: kaifong_db_scheduler
    init: true 
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://kaifong:kaifong1234@postgres:5432/kaifongdb
    volumes:
      - ./db-scheduler:/app/scripts   # bind mount ไว้เลย แก้ SQL แล้วรันได้ทันที
      - db_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  kaifong_db:
  ml_models:
  ml_logs:
  db_logs: